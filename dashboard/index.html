<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>陕西省人力资源政策监测看板</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#1d4ed8; --brand-soft:#eff4ff;
    --ok:#16a34a; --ok-bg:#e9f7ef; --warn:#d97706; --warn-bg:#fef3e2;
    --info:#2563eb; --info-bg:#eaf1ff; --gray:#64748b; --gray-bg:#eef2f7;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}

  /* Header */
  header.top{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:20px 24px;
    box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  header.top h1{margin:0;font-size:22px;letter-spacing:.5px}
  header.top .sub{font-size:13px;opacity:.92;margin-top:4px}
  .live{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:8px 14px;border-radius:999px;font-size:12.5px}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

  /* status strip */
  .status{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex:1;min-width:140px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.info{background:var(--info-bg);color:var(--info)}
  .pill.gray{background:var(--gray-bg);color:var(--gray)}

  /* filter panel */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .grp{margin-bottom:14px}
  .grp:last-child{margin-bottom:0}
  .grp .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:7px;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{cursor:pointer;user-select:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:5px 12px;border-radius:999px;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:#c7d2fe}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip .mk{width:9px;height:9px;border-radius:3px;display:inline-block}
  .row2{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 13px;cursor:pointer;font-size:13px;color:var(--ink)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--brand);color:#fff}
  input[type=text]{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;width:240px;outline:none}
  input[type=text]:focus{border-color:var(--brand)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--ink)}
  .btn:hover{background:#f8fafc}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}

  .legend{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .legend b{color:var(--ink)}

  /* alerts */
  .alert{background:var(--warn-bg);border:1px solid #fcd9a8;color:#92400e;border-radius:10px;padding:11px 15px;margin-bottom:14px;font-size:13.5px;display:flex;gap:8px;align-items:center}
  .alert .big{font-weight:800}

  /* grouping */
  .ghead{display:flex;align-items:center;gap:10px;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
  .ghead .name{font-size:17px;font-weight:800}
  .ghead .cnt{font-size:12px;color:var(--muted);background:var(--gray-bg);padding:2px 10px;border-radius:999px}

  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:11px;
    padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);transition:.15s}
  .card:hover{box-shadow:0 4px 14px rgba(16,24,40,.09)}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card .mod{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px;color:#fff;white-space:nowrap}
  .card h3{margin:8px 0 6px;font-size:15.5px;line-height:1.4}
  .card p{margin:0;color:#374151;font-size:13.5px}
  .card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;
    border-top:1px dashed var(--line);padding-top:9px}
  .src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .src a{font-weight:600}
  .meta-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .date{font-size:12px;color:var(--gray)}
  .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--gray);background:var(--gray-bg);padding:1px 8px;border-radius:6px}
  .countdown{font-size:12px;font-weight:800;color:#fff;background:var(--warn);padding:2px 10px;border-radius:999px}
  .countdown.soon{background:#dc2626}
  .amt{font-size:12px;font-weight:800;color:#0f766e;background:#ccfbf1;padding:2px 10px;border-radius:999px;white-space:nowrap}
  .subsidy-banner{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46}
  .empty{text-align:center;color:var(--muted);padding:50px 0;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
  .note{font-size:12px;color:var(--muted);margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px}
  .group.collapsed .cards{display:none}
  .toggle-grp{cursor:pointer;font-size:12px;color:var(--brand);user-select:none}
  .warn-banner{position:sticky;top:0;z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">陕西省人力资源政策监测看板</h1>
      <div class="sub" id="subtitle">加载中…</div>
    </div>
    <div class="live"><span class="dot"></span><span id="liveText">数据已更新</span></div>
  </header>

  <div class="status" id="statusStrip"></div>

  <div class="panel">
    <div class="grp">
      <span class="lbl">按城市筛选（可多选）</span>
      <div class="chips" id="cityChips"></div>
    </div>
    <div class="grp">
      <span class="lbl">按模块筛选（可多选）</span>
      <div class="chips" id="moduleChips"></div>
    </div>
    <div class="grp row2">
      <div>
        <span class="lbl">时间范围</span>
        <div class="seg" id="timeSeg">
          <button data-d="7">最近7天</button>
          <button data-d="30">最近30天</button>
          <button data-d="90">最近90天</button>
          <button data-d="0" class="on">全部</button>
        </div>
      </div>
      <div>
        <span class="lbl">数据校验</span>
        <div class="seg" id="verifySeg">
          <button data-v="all" class="on">全部</button>
          <button data-v="verified">已验证</button>
          <button data-v="pending">待核实</button>
          <button data-v="inferred">模型推断</button>
        </div>
      </div>
      <div>
        <span class="lbl">关键词</span><br/>
        <input type="text" id="kw" placeholder="搜索标题 / 标签 / 摘要…" />
      </div>
      <div>
        <span class="lbl">分组方式</span><br/>
        <div class="seg" id="groupSeg">
          <button data-g="city" class="on">按城市</button>
          <button data-g="module">按模块</button>
        </div>
      </div>
      <div style="margin-left:auto;align-self:center">
        <button class="btn" id="reset">重置筛选</button>
      </div>
    </div>
    <div class="legend">
      <span><b>校验标识：</b></span>
      <span class="pill ok">✓ 已验证</span><span>政府/官方/权威媒体/企业官方可点击核验</span>
      <span class="pill warn">◷ 待核实</span><span>二手或需进一步确认</span>
      <span class="pill info">〜 模型推断</span><span>基于公开数据的分析研判</span>
    </div>
  </div>

  <div id="subsidyAlert"></div>
  <div id="activityAlert"></div>
  <div id="results"></div>

  <div class="note" id="footNote"></div>
</div>

<script>
const VERIFY = {
  verified:{cls:'ok',label:'✓ 已验证'},
  pending:{cls:'warn',label:'◷ 待核实'},
  inferred:{cls:'info',label:'〜 模型推断'}
};
let DATA=null, refDate=null;
const state={cities:new Set(),modules:new Set(),days:0,verify:'all',kw:'',group:'city'};

function fmtDate(s){return s;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}

async function load(){
  try{
    const res=await fetch('data/dashboard.json',{cache:'no-store'});
    DATA=await res.json();
  }catch(e){
    document.getElementById('results').innerHTML=
      '<div class="empty">无法加载数据文件 data/dashboard.json。<br/>请通过本地服务器打开（如在该目录运行 <code>python -m http.server</code>）或部署到云端后访问。</div>';
    document.getElementById('subtitle').textContent='数据加载失败';
    return;
  }
  // reference date = lastUpdated snapshot
  refDate=new Date(DATA.meta.lastUpdated);
  document.getElementById('title').textContent=DATA.meta.title;
  document.getElementById('subtitle').textContent=DATA.meta.subtitle;
  document.getElementById('footNote').innerHTML='<b>数据说明：</b>'+DATA.meta.note+
    '<br/>更新频率：'+DATA.meta.updateFrequency+'　|　数据窗口：'+DATA.meta.dataWindowDays+'天　|　参考基准日：'+
    refDate.toLocaleDateString('zh-CN')+'。本看板由自动化任务每日10:00重做联网调研并刷新。';
  buildStatus();
  buildChips();
  bindControls();
  render();
}

function buildStatus(){
  const m=DATA.meta, items=DATA.items;
  const cnt={verified:0,pending:0,inferred:0};
  items.forEach(i=>cnt[i.verification]=(cnt[i.verification]||0)+1);
  const lu=new Date(m.lastUpdated), nu=new Date(m.nextUpdate);
  const f=t=>t.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('statusStrip').innerHTML=`
    <div class="stat"><div class="k">信息总量</div><div class="v">${items.length}</div></div>
    <div class="stat"><div class="k">已验证</div><div class="v" style="color:var(--ok)">${cnt.verified}</div></div>
    <div class="stat"><div class="k">待核实</div><div class="v" style="color:var(--warn)">${cnt.pending}</div></div>
    <div class="stat"><div class="k">模型推断</div><div class="v" style="color:var(--info)">${cnt.inferred}</div></div>
    <div class="stat"><div class="k">最近更新</div><div class="v" style="font-size:15px">${f(lu)}</div></div>
    <div class="stat"><div class="k">下次更新(每日10:00)</div><div class="v" style="font-size:15px">${f(nu)}</div></div>`;
}

function buildChips(){
  const cc=document.getElementById('cityChips');
  cc.innerHTML='<span class="chip active" data-all="city">全部</span>'+DATA.cities.map(c=>
    `<span class="chip" data-city="${c}">${c}</span>`).join('');
  cc.querySelectorAll('[data-city]').forEach(el=>el.onclick=()=>toggleCity(el));
  cc.querySelector('[data-all=city]').onclick=()=>{state.cities.clear();syncCityUI();render();};

  const mc=document.getElementById('moduleChips');
  mc.innerHTML='<span class="chip active" data-all="module">全部</span>'+DATA.modules.map(m=>
    `<span class="chip" data-module="${m.key}"><span class="mk" style="background:${m.color}"></span>${m.label}</span>`).join('');
  mc.querySelectorAll('[data-module]').forEach(el=>el.onclick=()=>toggleModule(el));
  mc.querySelector('[data-all=module]').onclick=()=>{state.modules.clear();syncModuleUI();render();};
}

function toggleCity(el){
  const c=el.dataset.city;
  if(state.cities.has(c))state.cities.delete(c);else state.cities.add(c);
  syncCityUI();render();
}
function toggleModule(el){
  const k=el.dataset.module;
  if(state.modules.has(k))state.modules.delete(k);else state.modules.add(k);
  syncModuleUI();render();
}
function syncCityUI(){
  const cc=document.getElementById('cityChips');
  cc.querySelectorAll('[data-city]').forEach(el=>el.classList.toggle('active',state.cities.has(el.dataset.city)));
  cc.querySelector('[data-all=city]').classList.toggle('active',state.cities.size===0);
}
function syncModuleUI(){
  const mc=document.getElementById('moduleChips');
  mc.querySelectorAll('[data-module]').forEach(el=>el.classList.toggle('active',state.modules.has(el.dataset.module)));
  mc.querySelector('[data-all=module]').classList.toggle('active',state.modules.size===0);
}

function bindControls(){
  document.getElementById('timeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.getElementById('timeSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');state.days=+b.dataset.d;render();
  });
  document.getElementById('verifySeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.getElementById('verifySeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');state.verify=b.dataset.v;render();
  });
  document.getElementById('groupSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.getElementById('groupSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');state.group=b.dataset.g;render();
  });
  document.getElementById('kw').oninput=e=>{state.kw=e.target.value.trim().toLowerCase();render();};
  document.getElementById('reset').onclick=()=>{
    state.cities.clear();state.modules.clear();state.days=0;state.verify='all';state.kw='';
    document.getElementById('kw').value='';
    document.getElementById('timeSeg').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',x.dataset.d==='0'));
    document.getElementById('verifySeg').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',x.dataset.v==='all'));
    syncCityUI();syncModuleUI();render();
  };
}

function passFilter(i){
  if(state.cities.size&&!state.cities.has(i.city))return false;
  if(state.modules.size&&!state.modules.has(i.module))return false;
  if(state.verify!=='all'&&i.verification!==state.verify)return false;
  if(state.days>0){
    const d=new Date(i.date);
    if(daysBetween(d,refDate)>state.days)return false;
  }
  if(state.kw){
    const hay=(i.title+i.summary+(i.tags||[]).join(' ')+i.source).toLowerCase();
    if(!hay.includes(state.kw))return false;
  }
  return true;
}

function moduleMeta(key){return DATA.modules.find(m=>m.key===key);}

function cardHTML(i){
  const mm=moduleMeta(i.module);
  const v=VERIFY[i.verification];
  let cd='';
  if(i.module==='activity'&&i.eventDate){
    const dd=daysBetween(refDate,new Date(i.eventDate));
    if(dd>=0&&dd<=14){
      cd=`<span class="countdown ${dd<=7?'soon':''}">⚠ 距活动 ${dd} 天</span>`;
    }
  }
  if(i.module==='subsidy'){
    if(i.amount) cd+=`<span class="amt">💰 ${i.amount}</span>`;
    if(i.deadline){
      const dd=daysBetween(refDate,new Date(i.deadline));
      if(dd>=0&&dd<=60) cd+=`<span class="countdown ${dd<=15?'soon':''}">⏳ 距申报截止 ${dd} 天</span>`;
      else if(dd<0) cd+=`<span class="countdown" style="background:#9ca3af">申报窗口已过</span>`;
    }
  }
  const tags=(i.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');
  return `<div class="card" style="border-left-color:${mm.color}">
    <div class="top">
      <span class="mod" style="background:${mm.color}">${mm.label}</span>
      ${cd}
    </div>
    <h3>${i.title}</h3>
    <p>${i.summary}</p>
    <div class="tags">${tags}</div>
    <div class="foot">
      <span class="src">📌 来源：<a href="${i.sourceUrl}" target="_blank" rel="noopener">${i.source}</a></span>
      <span class="meta-right">
        <span class="date">${fmtDate(i.date)}</span>
        <span class="pill ${v.cls}" title="${v.label}：数据核验状态">${v.label}</span>
      </span>
    </div>
  </div>`;
}

function render(){
  const filtered=DATA.items.filter(passFilter);
  const res=document.getElementById('results');
  // activity alert
  const alerts=DATA.items.filter(i=>i.module==='activity'&&i.eventDate);
  const within=alerts.filter(i=>{const dd=daysBetween(refDate,new Date(i.eventDate));return dd>=0&&dd<=14;})
    .sort((a,b)=>new Date(a.eventDate)-new Date(b.eventDate));
  const al=document.getElementById('activityAlert');
  if(within.length){
    al.innerHTML=`<div class="alert warn-banner">🔔 <span><b>活动14日预警：</b>有 <span class="big">${within.length}</span> 项行业重要活动将在14日内发生，请优先跟进：`+
      within.map(i=>`${i.title.split('（')[0].split('·')[0]}（${i.eventDate}）`).join('； ')+`</span></div>`;
  }else al.innerHTML='';

  // 职信宝补助申报窗口提示
  const sa=document.getElementById('subsidyAlert');
  const subs=DATA.items.filter(i=>i.module==='subsidy');
  const dueSub=subs.filter(i=>{
    if(!i.deadline)return false;
    const dd=daysBetween(refDate,new Date(i.deadline));
    return dd>=0&&dd<=60;
  }).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  const expiredSub=subs.filter(i=>i.deadline&&daysBetween(refDate,new Date(i.deadline))<0).length;
  if(dueSub.length||expiredSub){
    sa.innerHTML=`<div class="alert subsidy-banner">💡 <span><b>职信宝补助申报窗口：</b>`+
      (dueSub.length?`<span class="big">${dueSub.length}</span> 项将在60天内截止（`+
        dueSub.map(i=>`${i.title.split('：')[0]}→${i.deadline}`).join('； ')+`）`:'')+
      (expiredSub?`　另有 <b>${expiredSub}</b> 项窗口已过，请规划下一年度。`:'')+
      `</span></div>`;
  }else sa.innerHTML='';

  if(!filtered.length){res.innerHTML='<div class="empty">没有符合当前筛选条件的信息。请放宽筛选或点击「重置筛选」。</div>';return;}

  let html='';
  if(state.group==='city'){
    const order=DATA.cities;
    const groups={};
    filtered.forEach(i=>{(groups[i.city]=groups[i.city]||[]).push(i);});
    order.concat(Object.keys(groups).filter(c=>!order.includes(c))).forEach(city=>{
      if(!groups[city])return;
      const arr=groups[city].sort((a,b)=>DATA.modules.findIndex(m=>m.key===a.module)-DATA.modules.findIndex(m=>m.key===b.module)||new Date(b.date)-new Date(a.date));
      html+=`<div class="group">
        <div class="ghead"><span class="name">${city}</span><span class="cnt">${arr.length} 条</span>
        <span class="toggle-grp" onclick="this.closest('.group').classList.toggle('collapsed')">[收起/展开]</span></div>
        <div class="cards">${arr.map(cardHTML).join('')}</div></div>`;
    });
  }else{
    DATA.modules.forEach(mm=>{
      const arr=filtered.filter(i=>i.module===mm.key).sort((a,b)=>new Date(b.date)-new Date(a.date));
      if(!arr.length)return;
      html+=`<div class="group">
        <div class="ghead"><span class="name" style="color:${mm.color}">${mm.label}</span><span class="cnt">${arr.length} 条</span>
        <span class="toggle-grp" onclick="this.closest('.group').classList.toggle('collapsed')">[收起/展开]</span></div>
        <div class="cards">${arr.map(cardHTML).join('')}</div></div>`;
    });
  }
  res.innerHTML=html;
  // scroll alert into view handled by sticky
}

load();
</script>
</body>
</html>
